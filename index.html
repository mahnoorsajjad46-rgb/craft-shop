<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCraft - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .wrapper { max-width: 800px; width: 100%; text-align: center; }
        h1 { font-size: 38px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
        p { font-size: 16px; color: var(--muted); margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 12px 20px -3px rgba(99,102,241,0.1); border-color: var(--primary); }
        .icon { font-size: 48px; margin-bottom: 20px; }
        .card h3 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .card p { font-size: 14px; color: var(--muted); margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Welcome to ShopCraft 🚀</h1>
        <p>Select your portal to continue shopping or managing your store.</p>
        <div class="grid">
            <a href="shop.html" class="card">
                <div class="icon">🛍️</div>
                <h3>Buyer Portal</h3>
                <p>Browse products, calculate delivery, chat with sellers, and track orders live.</p>
            </a>
            <a href="seller.html" class="card">
                <div class="icon">📦</div>
                <h3>Seller Portal</h3>
                <p>Publish products from gallery, manage live chat inbox, and update order statuses.</p>
            </a>
        </div>
    </div>
</body>
</html>
